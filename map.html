<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_ds/indivisual-eyes-design-system-896a08f2-3b13-407d-9837-74ee0729c97d/tokens/fonts.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#FAF8F4}
  #map{width:100%;height:100%}
  .leaflet-container{font-family:'Archivo',system-ui,sans-serif;background:#FAF8F4}
  .leaflet-popup-content-wrapper{border-radius:2px;box-shadow:none;border:1px solid #17150F;background:#FFFFFF}
  .leaflet-popup-content{margin:14px 16px;font:400 14px/1.55 'Archivo',system-ui,sans-serif;color:#17150F}
  .leaflet-popup-content .lbl{font:400 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8A5A00;display:block;margin-bottom:8px}
  .leaflet-popup-tip{border:1px solid #17150F;box-shadow:none}
  .leaflet-bar a{color:#17150F;border-radius:2px}
  .leaflet-control-attribution{font:400 10px/1.4 'Archivo',system-ui,sans-serif;background:rgba(250,248,244,.85)}
</style>
</head>
<body>
<div id="map"></div>
<script>
  var pt = [38.5789, -121.4903];
  var map = L.map('map', { scrollWheelZoom: false }).setView(pt, 16);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors', maxZoom: 16 }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);
  var icon = L.divIcon({ className: '', html: '<div style="width:18px;height:18px;background:#FFB000;border:3px solid #17150F;border-radius:50%"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
  L.marker(pt, { icon: icon }).addTo(map)
    .bindPopup('<span class="lbl">IndiVisual Eyes</span>1200 K Street, Suite 5<br>Sacramento, CA 95814')
    .openPopup();
</script>
</body>
</html>
